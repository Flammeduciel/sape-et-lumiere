<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Sape &amp; Lumière - Brazzaville</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/main.css"/>
</head>
<body>

<!-- ═══════════════ HERO ═══════════════ -->
<header class="hero" id="hero">
  <div class="hero-overlay"></div>
  <div class="hero-bg" style="background-image: url('./assets/images/hero-background.png')"></div>
  <div class="hero-content">
    <div class="hero-text">
      <span class="hero-date">DU 18 AU 20 SEPTEMBRE 2026</span>
      <h1 class="hero-title">
        <span class="white">FESTIVAL</span>
        <span class="green">SAPE &amp;</span>
        <span class="red">LUMIÈRE</span>
      </h1>
      <p class="hero-desc">3 JOURS DE CULTURE, D'ÉLÉGANCE ET DE LUMIÈRE À BRAZZAVILLE</p>
    </div>
    <div class="hero-portrait">
      <img src="./assets/images/sapeurs-full.png" alt="Sapeur élégant"/>
    </div>
  </div>
  <!-- Countdown -->
  <div class="countdown glass-panel">
    <div class="container">
      <div class="countdown-inner">
        <div class="countdown-box">
          <span class="countdown-num" id="cd-days">00</span>
          <span class="countdown-label">JOURS</span>
        </div>
        <div class="countdown-box">
          <span class="countdown-num" id="cd-hours">00</span>
          <span class="countdown-label">HEURES</span>
        </div>
        <div class="countdown-box">
          <span class="countdown-num" id="cd-mins">00</span>
          <span class="countdown-label">MINUTES</span>
        </div>
        <div class="countdown-box">
          <span class="countdown-num" id="cd-secs">00</span>
          <span class="countdown-label">SECONDES</span>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- ═══════════════ PROGRAMME ═══════════════ -->
<section class="section programme" id="programme">
  <div class="programme-bg" style="background-image: url('https://picsum.photos/seed/african-pattern/1000/1000')"></div>
  <div class="container">
    <div class="section-header">
      <span class="badge badge-red">LE PROGRAMME</span>
      <h2 class="section-title">3 JOURS D'EXCEPTION</h2>
      <div class="section-divider"></div>
    </div>

    <div class="programme-tabs" id="programme-tabs"></div>

    <div class="card-white programme-card">
      <div class="programme-card-img">
        <img id="programme-img" src="" alt="Programme du jour"/>
      </div>
      <div class="programme-card-content">
        <div class="schedule-list" id="schedule-list"></div>
      </div>
    </div>
  </div>
</section>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
