<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond avec coins arrondis -->
  <rect width="512" height="512" rx="100" fill="#003f27"/>

  <!-- Halo lumineux décoratif (évocation de la "Lumière") -->
  <circle cx="256" cy="140" r="90" fill="#f5d227" opacity="0.15"/>
  <circle cx="256" cy="150" r="55" fill="#f5d227" opacity="0.25"/>

  <!-- Texte principal -->
  <text x="256" y="300"
        font-family="Montserrat, Arial, sans-serif"
        font-size="220"
        font-weight="900"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="-10">SL</text>

  <!-- Accent decoratif (ligne jaune) -->
  <rect x="181" y="345" width="150" height="14" rx="7" fill="#f5d227"/>
  <circle cx="400" cy="130" r="16" fill="#f5d227"/>
  <circle cx="110" cy="390" r="10" fill="#f5d227" opacity="0.8"/>
</svg>